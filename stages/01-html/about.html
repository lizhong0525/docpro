    <h1>关于 DocPro</h1>
    <p>DocPro 围绕本地文稿的局部修改展开。社区工作者整理活动通知时，可以把某一句交给编辑工具，再对照原稿决定是否采用。</p>
    <h2>三个编辑用语</h2>
    <dl>
      <dt><strong>选区</strong></dt><dd>由起点和终点圈定的文字范围。</dd>
      <dt><strong>建议</strong></dt><dd>对选区提出的替换文本，等待作者审阅。</dd>
      <dt><strong>撤销</strong></dt><dd>回到接受修改前的状态，以便重新判断。</dd>
    </dl>
    <section id="checklist">
      <h2>发布前核对清单</h2>
      <ul>
        <li>时间包含日期或星期，以及明确的开始和结束时刻。</li>
        <li>地点能让第一次到访的居民找到入口和办理位置。</li>
        <li>说明列出需要携带的物品，以及寻求帮助的方式。</li>
      </ul>
      <p><a href="index.html#revision">回看共享书架公告的改稿示例</a></p>
    </section>
